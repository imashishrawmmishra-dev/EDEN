name: EDEN Continuous Integration & Deployment

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 🛠️ Test & Build EDEN Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: 🔐 Prepare Environment & Debug Keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 📦 Build Android APK (Debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📱 Build Android App Bundle (AAB for Google Play)
        run: ./gradlew bundleDebug --no-daemon --stacktrace

      - name: 🧪 Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --continue || true

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDEN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 📤 Upload App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDEN-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 14

  release-and-publish:
    name: 🚀 Publish Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: 🔐 Prepare Environment & Debug Keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 📦 Build Production APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 🏷️ Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
